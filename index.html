<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nubix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="css/global.css">
</head>

<body>
    <!-- Navigation -->
  <header>
    <!-- Cambiamos bg-dark por bg-nubix-navy -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-nubix-navy">
        <div class="container-fluid">
            <!-- Logo -->
            <a class="navbar-brand" href="#">
                <!-- Nota: asegúrate de que el logo quede bien sobre el fondo Navy oscuro -->
                <img src="/assets/logoNubix.png" alt="Logo Nubix" height="30" width="auto" class="d-inline-block align-text-top">
            </a>
            
            <!-- Botón Hamburguesa -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú Colapsable -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Enlaces a la derecha -->
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
    <!-- Main Content -->
    <main>
        <section>
            <h1>Bienvenido a Nuestro Sitio Web</h1>
            <p>Este es un ejemplo de una página web simple con HTML.</p>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2023 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
